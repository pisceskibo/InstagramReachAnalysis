<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Instagram Reach Prediction</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        .description {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #8e44ad;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #732d91;
        }

        .required {
            color: red;
            font-weight: bold;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f0e6f7;
            border-radius: 10px;
            text-align: center;
        }

        .result h2 {
            color: #8e44ad;
        }

        .result p {
            font-size: 28px;
            font-weight: bold;
        }

        .error {
            margin-top: 20px;
            padding: 15px;
            background: #ffe6e6;
            color: #cc0000;
            border-radius: 8px;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>Instagram Reach Prediction</h1>
    <p class="description">Predict Instagram post impressions using Machine Learning</p>

    <form method="post" action="/predict">

        <div class="form-group">
            <label>
                Likes <span class="required">*</span>
            </label>
            <input type="number" name="likes" step="any" required>
        </div>

        <div class="form-group">
            <label>
                Saves <span class="required">*</span>
            </label>
            <input type="number" name="saves" step="any" required>
        </div>

        <div class="form-group">
            <label>
                Comments <span class="required">*</span>
            </label>
            <input type="number" name="comments" step="any" required>
        </div>

        <div class="form-group">
            <label>
                Shares <span class="required">*</span>
            </label>
            <input type="number" name="shares" step="any" required>
        </div>

        <div class="form-group">
            <label>
                Profile Visits <span class="required">*</span>
            </label>
            <input type="number" name="profile_visits" step="any" required>
        </div>

        <div class="form-group">
            <label>
                Follows <span class="required">*</span>
            </label>
            <input type="number" name="follows" step="any" required>
        </div>

        <div class="form-group">
            <label>
                Captions
            </label>
            <input type="text" name="captions">
        </div>

        <button type="submit">
            Predict Reach
        </button>
    </form>

    <div class="result">
        <h2>RESULT</h2>
    </div>
</div>

</body>
</html>
